name: CB Paper Trading

# 可转债模拟盘 + 全站数据每日自动跑：
# 北京时间 15:45 / 17:30 / 19:30 / 21:30 四个时段尝试（UTC 07:45/09:30/11:30/13:30）。
# GitHub 高峰期常延迟/丢弃 cron，多时段冗余；引擎与数据更新均幂等，重复运行无害。
on:
  schedule:
    - cron: '45 7 * * 1-5'
    - cron: '30 9 * * 1-5'
    - cron: '30 11 * * 1-5'
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # 支持手动运行

permissions:
  contents: write
  actions: write # 允许本工作流以 workflow_dispatch 触发 deploy.yml

concurrency:
  group: cb-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          pip install requests
          npm ci

      # 主数据更新并入本工作流: GitHub 高峰期常丢弃/延迟上午的 update-data cron,
      # 收盘后这条链路(15:45/16:45)承担全站数据刷新
      - name: Run index data update
        id: data
        run: |
          set +e
          npm run data:update
          echo "data_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run paper engine
        id: run
        run: |
          set +e
          python3 scripts/cb_paper_trading.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit and push state
        if: steps.run.outputs.exit_code == '0'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cb/paper public/cb_paper.json reports/cb_paper_latest.md public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无新数据（非交易日或已处理），跳过提交"
          else
            git commit -m "chore(data): daily data + paper trading update $(date -u +%F-%H:%M UTC)"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -R ${{ github.repository }}

      - name: Failure notice
        if: steps.run.outputs.exit_code != '0'
        run: |
          echo "::warning::模拟盘引擎运行失败，线上保持上一交易日状态。请检查 Actions 日志。"
          exit 1
