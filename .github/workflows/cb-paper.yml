name: CB Paper Trading

# 可转债模拟盘每日自动跑（只管转债数据，与指数数据工作流完全独立）：
# 北京时间 15:45 / 17:30 / 19:30 / 21:30 四个时段尝试（UTC 07:45/09:30/11:30/13:30）。
# GitHub 高峰期常延迟/丢弃 cron，多时段冗余；引擎幂等，重复运行无害。
# 数据源：东方财富转债接口（与指数数据的腾讯接口互相独立，一边故障不影响另一边）。
on:
  schedule:
    - cron: '45 7 * * 1-5'
    - cron: '30 9 * * 1-5'
    - cron: '30 11 * * 1-5'
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # 支持手动运行

permissions:
  contents: write
  actions: write # 允许本工作流以 workflow_dispatch 触发 deploy.yml

concurrency:
  group: cb-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run paper engine
        id: run
        run: |
          set +e
          python3 scripts/cb_paper_trading.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit and push state
        if: steps.run.outputs.exit_code == '0'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # rebase 应对与 Update Data 工作流的并发提交
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git add data/cb/paper public/cb_paper.json reports/cb_paper_latest.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "模拟盘无新数据（非交易日或已处理），跳过提交"
          else
            git commit -m "chore(cb-paper): daily paper trading update $(date -u +%F-%H:%M UTC)"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -R ${{ github.repository }}

      - name: Failure notice
        if: steps.run.outputs.exit_code != '0'
        run: |
          echo "::warning::模拟盘引擎运行失败，线上转债数据保持上一交易日状态。指数数据不受影响。请检查 Actions 日志。"
          exit 1
