name: CB Paper Trading

# 可转债模拟盘每日自动跑：
# 北京时间 15:45（UTC 07:45）首轮；16:45（UTC 08:45）补跑（应对数据源延迟出日线）。
# 引擎幂等：同一天重复运行自动跳过；非交易日无新数据不会产生提交。
on:
  schedule:
    - cron: '45 7 * * 1-5'
    - cron: '45 8 * * 1-5'
  workflow_dispatch: # 支持手动运行

permissions:
  contents: write
  actions: write # 允许本工作流以 workflow_dispatch 触发 deploy.yml

concurrency:
  group: cb-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run paper engine
        id: run
        run: |
          set +e
          python3 scripts/cb_paper_trading.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit and push state
        if: steps.run.outputs.exit_code == '0'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cb/paper public/cb_paper.json reports/cb_paper_latest.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "模拟盘无新数据（非交易日或已处理），跳过提交"
          else
            git commit -m "chore(cb-paper): daily paper trading update $(date -u +%F-%H:%M UTC)"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -R ${{ github.repository }}

      - name: Failure notice
        if: steps.run.outputs.exit_code != '0'
        run: |
          echo "::warning::模拟盘引擎运行失败，线上保持上一交易日状态。请检查 Actions 日志。"
          exit 1
