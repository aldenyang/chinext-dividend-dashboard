name: Update Data

# A股交易日收盘后尝试增量更新：
# 北京时间 15:30（UTC 07:30）首轮；16:30（UTC 08:30）补跑（应对数据源延迟出日线）。
# 注意：GitHub Actions 定时任务可能延迟数分钟到数十分钟执行，不保证精确时刻。
on:
  schedule:
    - cron: '30 7 * * 1-5'
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支持手动运行

permissions:
  contents: write
  actions: write # 允许本工作流以 workflow_dispatch 触发 deploy.yml

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 留出 rebase 空间，避免与部署提交冲突
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run incremental update
        id: update
        run: |
          set +e
          npm run data:update
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit and push data changes
        if: steps.update.outputs.exit_code == '0'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，跳过提交"
          else
            git add public/data
            git commit -m "chore(data): daily index data update $(date -u +%F-%H:%M UTC)"
            # 用 rebase 应对并发提交
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "数据已更新并推送，将自动触发部署"
          fi

      - name: Trigger Pages deploy
        # 注意：GITHUB_TOKEN 的 push 不会触发其他工作流（防递归），
        # 因此数据推送成功后需显式以 workflow_dispatch 方式触发部署
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -R ${{ github.repository }}

      - name: Failure notice
        if: steps.update.outputs.exit_code != '0'
        run: |
          echo "::warning::数据更新失败，已保留线上旧版本数据。请检查 Actions 日志中的失败原因（数据源不可用/校验失败等）。"
          exit 1
